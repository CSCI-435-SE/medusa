services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    environment:
      # Keep ~/.claude.json inside the persisted config dir as well
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      - ..:/workspaces/medusa:cached
      - node_modules:/workspaces/medusa/node_modules
      - claude-config:/home/node/.claude
    command: sleep infinity
    # Share the postgres container's network so Postgres and Redis are on
    # localhost, matching the commands in STUDENTS.md verbatim.
    network_mode: service:postgres
    depends_on:
      - postgres
      - redis

  postgres:
    # Debian-based like the CI image: Alpine's musl ignores locale collation,
    # so text sorts byte-wise and order-dependent tests fail locally.
    image: postgres:16
    # STUDENTS.md uses localhost:5433 for Postgres
    command: ["postgres", "-c", "port=5433"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # All host ports for the shared network are published here. They are
    # offset from STUDENTS.md (5433/6380) so they don't collide with the
    # standalone medusa-pg / medusa-redis containers on the host.
    ports:
      - "127.0.0.1:5434:5433"
      - "127.0.0.1:6381:6379"
    volumes:
      # New volume: data initialized under musl collation isn't safe to reuse
      # with glibc (text indexes can be ordered differently)
      - pgdata-debian:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # Listens on 6379, the default the Redis integration tests connect to
    network_mode: service:postgres
    depends_on:
      - postgres

volumes:
  node_modules:
  pgdata-debian:
  claude-config:
